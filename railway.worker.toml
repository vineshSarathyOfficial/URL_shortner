# Copy these settings when creating the Worker service in Railway:
#   Root Directory: (repo root)
#   Build Command:  cd backend && npm install && npm run build:full
#   Start Command:  cd backend && npm run worker:prod

[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm install && npm run build:full"

[deploy]
startCommand = "cd backend && npm run worker:prod"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
